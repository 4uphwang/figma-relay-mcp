<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        font: 12px/1.4 system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
        margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 12px;
        color: var(--figma-color-text); background: var(--figma-color-bg);
        word-break: keep-all;
      }
      [hidden] { display: none !important; }
      button { font: inherit; cursor: pointer; }

      header { display: flex; align-items: center; gap: 8px; }
      .icon-btn { width: 20px; height: 20px; margin-right: -4px; border: 0; border-radius: 4px; padding: 0; background: none; color: var(--figma-color-icon-secondary); display: grid; place-items: center; }
      .icon-btn:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-icon); }
      .icon-btn svg { width: 12px; height: 12px; }
      /* 접힌 막대: 머리만 남긴다 */
      body.mini { padding: 8px 12px; }
      body.mini > :not(header, .pages, script) { display: none !important; }
      body.mini { gap: 6px; }
      body.mini .title { font-size: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); }
      .title { font-size: 13px; font-weight: 600; flex: 1; }
      .pill { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; color: var(--tone); background: var(--tone-soft); }

      body[data-tone='ok'] { --tone: var(--figma-color-text-success); --tone-soft: var(--figma-color-bg-success-tertiary); }
      body[data-tone='wait'] { --tone: var(--figma-color-text-warning); --tone-soft: var(--figma-color-bg-warning-tertiary); }
      body[data-tone='bad'] { --tone: var(--figma-color-text-danger); --tone-soft: var(--figma-color-bg-danger-tertiary); }

      .banner { padding: 10px; border-radius: 6px; background: var(--tone-soft); display: flex; flex-direction: column; gap: 3px; }
      .banner strong { color: var(--tone); font-weight: 600; }
      .banner span { font-size: 11px; line-height: 16px; }

      .pages ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; max-height: 240px; overflow-x: hidden; overflow-y: auto; }
      .page {
        width: 100%; height: 26px; padding: 0 8px; border: 0; border-radius: 5px; display: flex; align-items: center; gap: 8px;
        background: none; color: var(--figma-color-text-secondary); text-align: left; white-space: nowrap;
      }
      .page span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .page-key { flex: none; font: 10px ui-monospace, 'SF Mono', Menlo, monospace; color: var(--figma-color-text-tertiary); }
      .page:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }
      .page[aria-current='page'] { background: var(--figma-color-bg-selected); color: var(--figma-color-text); font-weight: 500; }
      .page:focus-visible { outline: 1px solid var(--figma-color-border-brand-strong); outline-offset: -1px; }
      .page-divider { height: 1px; margin: 4px 8px; background: var(--figma-color-border); }
      .info { padding: 10px; border-radius: 6px; background: var(--figma-color-bg-secondary); display: grid; grid-template-columns: 36px 1fr; gap: 6px 8px; }
      .info dt { color: var(--figma-color-text-secondary); }
      .info dd.session { font: 11px ui-monospace, 'SF Mono', Menlo, monospace; user-select: all; }
      .info dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .row { display: flex; align-items: center; gap: 12px; }
      .note { flex: 1; font-size: 11px; color: var(--figma-color-text-secondary); }
      .link { border: 0; padding: 0; background: none; font-size: 11px; font-weight: 500; color: var(--figma-color-text-brand); margin-left: auto; }
      .btn { height: 28px; padding: 0 12px; border-radius: 5px; font-weight: 500; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: var(--figma-color-text); flex: 1; }
      .btn.primary { border: 0; background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); width: 100%; }

      .history-head { display: flex; align-items: center; padding-bottom: 4px; font-size: 11px; font-weight: 600; color: var(--figma-color-text-secondary); }
      ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-x: hidden; overflow-y: auto; }
      .entry { padding: 6px 8px; border-radius: 5px; display: flex; flex-direction: column; gap: 4px; min-width: 0; --mark: var(--figma-color-text-success); }
      .entry[data-ok='false'] { --mark: var(--figma-color-text-danger); }
      .entry[data-ok='pending'] { --mark: var(--figma-color-text-tertiary); }
      .entry.expandable { cursor: pointer; }
      .entry.open { background: var(--figma-color-bg-secondary); }
      .entry.open[data-ok='false'] { background: var(--figma-color-bg-danger-tertiary); }
      .entry-top { display: flex; align-items: center; gap: 8px; font-size: 11px; white-space: nowrap; }
      .entry-top::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--mark); }
      .method { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .entry[data-ok='false'] .method, .entry-error { color: var(--figma-color-text-danger); }
      .client { flex: 0 1 auto; min-width: 24px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; border-radius: 3px; font-size: 10px; line-height: 15px; color: var(--figma-color-text-secondary); background: var(--figma-color-bg-tertiary); }
      .entry-sub { display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 11px; white-space: nowrap; }
      .summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--figma-color-text-secondary); }
      .meta { margin-left: auto; flex: none; color: var(--figma-color-text-secondary); }
      .entry .link { margin-left: 0; }
      .entry-error { font-size: 11px; line-height: 16px; word-break: break-word; }
      .entry pre { margin: 0; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); font: 10px/14px ui-monospace, 'SF Mono', Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; cursor: text; }

      form { display: flex; flex-direction: column; gap: 6px; margin: 0; }
      .cmd { display: flex; align-items: center; padding: 6px 8px; border-radius: 5px; background: var(--figma-color-bg-secondary); font: 11px ui-monospace, 'SF Mono', Menlo, monospace; }
      .cmd code { flex: 1; font: inherit; }
      input { height: 28px; padding: 0 8px; border-radius: 5px; font: inherit; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: var(--figma-color-text); }
      input:focus { outline: none; border-color: var(--figma-color-border-brand-strong); }
      body[data-tone='bad'] input { border-color: var(--figma-color-border-danger-strong); }
    </style>
  </head>
  <body data-tone="wait">
    <header>
      <div class="dot"></div>
      <div class="title">figma-mcp</div>
      <div class="pill" id="pill">시작 중</div>
      <button class="icon-btn" id="collapse" type="button" title="접기">
        <svg id="collapseIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6h7" /></svg>
      </button>
    </header>

    <nav class="pages" id="pagesRow" aria-label="페이지" hidden>
      <ul id="pages"></ul>
    </nav>

    <div class="banner" id="banner" hidden>
      <strong id="bannerTitle"></strong>
      <span id="bannerBody"></span>
    </div>

    <dl class="info" id="info">
      <dt>파일</dt><dd id="file">-</dd>
      <dt>서버</dt><dd id="server">-</dd>
      <dt id="sessionLabel" hidden>ID</dt><dd id="session" class="session" hidden title="Claude에게 이 id로 파일을 지정할 수 있습니다"></dd>
    </dl>

    <section id="history" hidden>
      <div class="history-head">
        <span id="historyTitle">활동 기록</span>
        <button class="link" id="clearHistory" type="button">지우기</button>
      </div>
      <ol id="entries"></ol>
    </section>

    <div class="row" id="actions">
      <span class="note" id="note" hidden>기록은 이 파일에 대해 50건까지 남습니다</span>
      <button class="btn" id="retry" type="button" hidden>지금 다시 연결</button>
      <button class="link" id="editToken" type="button">토큰 변경</button>
    </div>

    <form id="tokenForm" hidden>
      <div class="cmd">
        <code id="cmd">cat ~/.figma-mcp/token</code>
        <button class="link" id="copy" type="button">복사</button>
      </div>
      <input id="token" type="password" placeholder="토큰 붙여 넣기" autocomplete="off" />
      <button class="btn primary" id="save" type="submit">저장하고 연결</button>
    </form>
    <!-- SCRIPT -->
  </body>
</html>
